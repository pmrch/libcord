name: ci

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: apk add --no-cache clang lld llvm make bear binutils git build-base

      - name: Build and test
        working-directory: tls
        run: |
          make static
          make get_donna

          pwd
          ls -la tests/
          echo "=== Make variables ==="
          make -C tests -pn | grep -E '^(TESTS_SRC|TESTS) ='
          echo "=== Clean build ==="
          make -C tests clean
          make -C tests --trace test