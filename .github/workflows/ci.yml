name: ci

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tls

    steps:
      - uses: actions/checkout@v4

      - name: Install clang, lld, llvm
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm bear make

      - name: Acquire donna X25519 impl
        run: make get_donna

      - name: Build static library
        run: make static ARCH=x86-64-v3 STRICT_FLAGS=-Wall -Werror -Wno-declaration-after-statement

      - name: Build and run tests
        run: make test

  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tls

    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm bear make
      - run: make static ARCH=x86-64-v3 STRICT_FLAGS=-Wall -Werror -Wno-declaration-after-statement
      - run: make get_donna
      - name: Differential fuzz (10k iterations)
        run: make -C tests test_fe
